<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EUMO{% endblock %}</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <style>
        body.page-entering main {
            opacity: 0;
            transform: translateY(12px);
            filter: blur(8px);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -22% auto auto -18%;
            width: 620px;
            height: 620px;
            border-radius: 999px;
            pointer-events: none;
            z-index: -1;
            background: radial-gradient(circle, rgba(172, 224, 255, 0.1) 0%, rgba(172, 224, 255, 0) 70%);
            animation: ambientFloatA 30s ease-in-out infinite;
        }

        body::after {
            inset: auto -18% -26% auto;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(154, 245, 213, 0.08) 0%, rgba(154, 245, 213, 0) 72%);
            animation: ambientFloatB 36s ease-in-out infinite;
        }

        body main {
            transition: opacity 620ms cubic-bezier(0.22, 1, 0.36, 1),
                transform 620ms cubic-bezier(0.22, 1, 0.36, 1),
                filter 620ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        body.page-leaving {
            overflow: hidden;
        }

        body.page-leaving main {
            opacity: 0;
            transform: translateY(-10px);
            filter: blur(6px);
            transition: opacity 520ms cubic-bezier(0.22, 1, 0.36, 1),
                transform 520ms cubic-bezier(0.22, 1, 0.36, 1),
                filter 520ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes ambientFloatA {

            0%,
            100% {
                transform: translate3d(0, 0, 0) scale(1);
                opacity: 0.56;
            }

            50% {
                transform: translate3d(24px, -20px, 0) scale(1.08);
                opacity: 0.84;
            }
        }

        @keyframes ambientFloatB {

            0%,
            100% {
                transform: translate3d(0, 0, 0) scale(1);
                opacity: 0.48;
            }

            50% {
                transform: translate3d(-28px, 22px, 0) scale(1.1);
                opacity: 0.75;
            }
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="min-h-screen bg-[#f2f0ff] text-[#323963] antialiased">
    <main class="mx-auto max-w-5xl px-6 py-12">
        {% block content %}{% endblock %}
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.add("page-entering");
            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    document.body.classList.remove("page-entering");
                });
            });

            if (window.lucide && typeof window.lucide.createIcons === "function") {
                window.lucide.createIcons();
            }

            const links = document.querySelectorAll("a[data-nav-transition='true']");
            links.forEach(function (link) {
                link.addEventListener("click", function (event) {
                    const href = link.getAttribute("href");
                    const target = link.getAttribute("target");
                    if (!href || href.startsWith("#") || target === "_blank") return;
                    if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

                    event.preventDefault();
                    document.body.classList.add("page-leaving");
                    setTimeout(function () {
                        window.location.href = href;
                    }, 380);
                });
            });
        });
    </script>
</body>

</html>
